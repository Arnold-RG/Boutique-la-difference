name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare the public shop
        run: |
          mkdir -p _public
          rsync -a \
            --exclude '_public' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'admin' \
            --exclude 'server' \
            --exclude 'node_modules' \
            --exclude 'README.md' \
            --exclude 'LICENSE' \
            ./ _public/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
