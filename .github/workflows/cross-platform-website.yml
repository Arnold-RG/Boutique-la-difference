name: Cross-platform boutique static checks

on:
  push:
    branches: [main]
    paths:
      - 'assets/css/site.css'
      - 'index.html'
      - '.github/tests/static-site.mjs'
      - '.github/workflows/cross-platform-website.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .github/tests/static-site.mjs
